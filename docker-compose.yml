services:
  # ─── 1. MongoDB Document Store ─────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: vcgis-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=vcgis
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vcgis-network

  # ─── 2. Redis Cache Store ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vcgis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vcgis-network

  # ─── 3. AI Intelligence Microservice ──────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vcgis-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ai/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vcgis-network

  # ─── 4. Node.js Backend API Gateway ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vcgis-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/vcgis
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000/api/ai
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://127.0.0.1
      - JWT_ACCESS_SECRET=vcgis-production-access-secret-karnataka-2026
      - JWT_REFRESH_SECRET=vcgis-production-refresh-secret-karnataka-2026
      - COOKIE_SECRET=vcgis-production-cookie-secret-karnataka-2026
      - RATE_LIMIT_POINTS=120
      - RATE_LIMIT_DURATION_SECONDS=60
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vcgis-network

  # ─── 5. Nginx Production Web Frontend ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vcgis-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - vcgis-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  vcgis-network:
    driver: bridge
